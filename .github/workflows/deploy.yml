name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  # erlaubt das manuelle Auslösen im Reiter "Actions"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# gleichzeitige Deployments vermeiden
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Production-Build erstellen
        # SITE_URL bestimmt Canonical-Tags, Open Graph, sitemap.xml und llms.txt.
        # Eigene Domain? Dann hier die eigene Adresse eintragen.
        env:
          SITE_URL: https://pizzakaufen.github.io
        run: npm run build

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
